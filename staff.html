<!DOCTYPE html>
<html lang="ur">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staff - Sultanat-e-Mughlia</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#fff7e6;padding:12px}h1{text-align:center;background:#3d0a0a;color:#d4af37;padding:16px}.links{text-align:center;background:#140202;padding:10px}.links a{color:#fff;text-decoration:none;font-weight:900;margin:0 8px}.lock{background:#fff;padding:20px;border-radius:14px;text-align:center;margin:12px}.lock input{width:100%;padding:14px;margin:10px 0;border:2px solid #333;border-radius:12px;text-align:center;font-size:18px}.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;margin-top:8px}.green{background:#27ae60;color:#fff}.gold{background:#d4af37}.dark{background:#333;color:#fff}</style>
</head>
<body>
<h1>👨‍🍳 STAFF - Sultanat-e-Mughlia</h1>
<div class="links"><a href="index.html">🍽️ MENU</a><a href="kitchen.html">🔥 KITCHEN</a><a href="staff.html">👨‍🍳 STAFF</a><a href="admin.html">⚙️ ADMIN</a></div>
<div id="lock" class="lock"><h2>🔒 Staff Lock Hai</h2><p>Waiter PIN dalo</p><input id="pin" type="password" placeholder="PIN dalo"><button class="btn green" onclick="unlock()">UNLOCK STAFF</button><p id="err" style="color:red;font-weight:900;display:none;margin-top:8px">❌ Incorrect PIN - Dobara Try Karo</p></div>
<div id="main" style="display:none"><p style="text-align:center;padding:10px">WhatsApp / Easypaisa: 0315-2045030</p><button class="btn gold" onclick="loadOrders()">🔄 Refresh - Naye Order Dekho</button><h3 style="padding:10px">📋 Aaj Ke Orders:</h3><div id="list"></div><button class="btn dark" onclick="logout()">Logout</button></div>
<script>
function unlock(){ if(document.getElementById('pin').value.trim()==="@mehtab22338899"){ document.getElementById('lock').style.display='none'; document.getElementById('main').style.display='block'; loadOrders(); } else { document.getElementById('err').style.display='block'; alert('❌ Incorrect PIN'); } }
function logout(){ document.getElementById('lock').style.display='block'; document.getElementById('main').style.display='none'; }
function loadOrders(){ var o=[]; try{ o=JSON.parse(localStorage.getItem('s_orders')||'[]'); }catch(e){ o=[]; } if(!o.length){ document.getElementById('list').innerHTML='<p style="text-align:center">Koi order nahi.</p>'; return; } var h=''; for(var i=0;i<o.length;i++){ h+='<div style="background:#fff;padding:14px;border-radius:12px;margin:10px 0;border:2px solid #ddd"><b>Table '+o[i].table+' - Rs '+o[i].total+'</b><br>'+o[i].items.join(', ')+'<br>Status: '+o[i].status+' | '+o[i].pay+'</div>'; } document.getElementById('list').innerHTML=h; }
setInterval(function(){ if(document.getElementById('main').style.display==='block') loadOrders(); },5000);
</script>
</body>
</html>
